<app-shell>
  <div class="game-page">
    <header class="game-header">
      <div class="meta-row">
        <!-- <span class="issue">daily cue</span>
        <span class="issue-number">#142</span> -->
        <p class="game-title">filme do dia</p>
        <p class="issue-number">
          <span class="issue">#</span>
          142
        </p>
      </div>

        <div class="game-date">
          <p class="game-date-label">08 SET 26</p>
          <p class="game-date-value">6 TENTATIVAS RESTANTES</p>
        </div>

      <!-- <h1 class="game-title">filme do dia</h1> -->
    </header>

    <div class="progress" aria-label="Progresso das tentativas">
      <span class="progress-bar is-active"></span>
      <span class="progress-bar is-active"></span>
      <span class="progress-bar"></span>
      <span class="progress-bar"></span>
      <span class="progress-bar"></span>
    </div>

    <main class="game-panel">
      <section class="deck" aria-label="Reprodutor de áudio">
        <div class="deck-labels">
          <span>now playing</span>
          <span>02:14</span>
        </div>

        <div class="player">
          <div class="wave">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>        
          </div>

          <div class="revealed-seconds">
            <div class="second">
              <div class="second-bar"></div>
              <span class="s"></span>
            </div>
            <div class="second">
              <div class="second-bar"></div>
              <span class="s"></span>
            </div>
            <div class="second">
              <div class="second-bar"></div>
              <span class="s"></span>
            </div>
            <div class="second">
              <div class="second-bar"></div>
              <span class="s"></span>
            </div>
            <div class="second">
              <div class="second-bar"></div>
              <span class="s"></span>
            </div>
            <div class="second">
              <div class="second-bar"></div>
              <span class="s"></span>
            </div>
          </div>
        
        </div>


        <div class="player-actions">
          <button class="ghost-button" type="button">
            <span class="button-icon" aria-hidden="true">↻</span>
            <span>ouvir de novo</span>
          </button>
          <button class="ghost-button" type="button">
            <span class="button-icon" aria-hidden="true">＋</span>
            <span>ouvir mais</span>
          </button>
        </div>
      </section>

      <section class="guess-panel" aria-label="Palpite do filme">
        <label class="input-label" for="movie-guess">seu palpite</label>

        <div class="guess-form">
          <input
            id="movie-guess"
            class="guess-input"
            type="text"
            placeholder="digite o nome do filme"
            aria-label="Digite o nome do filme"
          />
          <button class="submit-button" type="button">confirmar</button>
        </div>
      </section>

      <section class="history" aria-label="Histórico de tentativas">
        <div class="history-head">
          <span>tentativas</span>
          <span class="history-counter">3/5</span>
        </div>

        <div class="guess-list">
          <div class="guess-row is-wrong">
            <span class="guess-mark">✕</span>
            <span class="guess-name">movie name</span>
          </div>
          <div class="guess-row is-wrong">
            <span class="guess-mark">✕</span>
            <span class="guess-name">another title</span>
          </div>
          <div class="guess-row is-pending">
            <span class="guess-mark">•</span>
            <span class="guess-name">aguardando</span>
          </div>
        </div>
      </section>
    </main>
  </div>
</app-shell>
