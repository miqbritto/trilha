<app-shell>
   <div class="history-page">
        <header class="history-header">
            <p>arquivo de desafios</p>
            <div class="header-title">
                <h1>Histórico</h1>
                <p>x desafios · #x ao #x</p>
            </div>
            <hr>
        </header>

    <body class="history-body">

        <div class="challenge-items">
            @for (challenge of challenges(); track $index) {
                <app-challenge-card
                    [dateLabel]="challenge.date"
                    [number]="challenge.number"
                />
            }
        </div>

    </body>
    

   </div>
    
</app-shell>
